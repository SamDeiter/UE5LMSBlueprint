<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UE5 Event Tick Node Reference</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* --- 1. KEY COLORS & GRADIENTS --- */
        :root {
            --node-body: rgba(20, 20, 20, 0.95);
            --node-border: #000000;
            /* The dark red gradient for Event Headers */
            --header-event-red: linear-gradient(to bottom, #750000 0%, #300000 100%);
            /* Pin Colors */
            --pin-exec: #FFFFFF;
            /* UE5 Vibrant Neon Green */
            --pin-float: #00EA32; 
        }

        /* --- 2. NODE CONTAINER --- */
        .ue-node {
            position: relative;
            min-width: 180px;
            background: var(--node-body);
            border-radius: 12px;
            /* Double border for 3D edge + Drop Shadow */
            box-shadow: 0 0 0 1px var(--node-border), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.1),
                        0 10px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            font-family: 'Roboto', sans-serif;
            color: white;
            overflow: hidden;
            display: inline-flex;
            flex-direction: column;
            user-select: none;
        }

        /* --- 3. THE GLASSY HEADER --- */
        .ue-header {
            background: var(--header-event-red);
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 24px;
            border-bottom: 1px solid black;
            position: relative;
        }
        
        /* The "Gloss" Overlay */
        .ue-header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, transparent 100%);
            pointer-events: none;
        }

        .node-title { font-weight: 700; font-size: 13px; text-shadow: 1px 1px 0 rgba(0,0,0,0.8); }

        /* --- 4. THE DELEGATE ICON (Hollow Red Square) --- */
        .delegate-icon {
            width: 10px;
            height: 10px;
            background-color: transparent; /* HOLLOW */
            border: 2px solid #ff4444;     /* Red Border */
            border-radius: 3px;
            margin-left: auto;             /* Pushes to far right */
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }

        /* --- 5. PIN LAYOUT --- */
        .ue-body { display: flex; justify-content: space-between; padding: 10px 0 12px 0; }
        
        /* MODIFIED: Split padding for inputs/outputs to allow right-side flush alignment */
        .column { display: flex; flex-direction: column; gap: 12px; }
        
        .column.inputs { padding: 0 12px; }
        
        /* THE FIX: Added 10px right padding to match the reference image exactly */
        .column.outputs { padding: 0 10px 0 12px; align-items: flex-end; }
        
        .pin-row { display: flex; align-items: center; gap: 6px; height: 16px; }
        
        .pin-label { 
            font-size: 11px; 
            color: #eee; 
            font-weight: 500; 
            text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
            line-height: 1; 
        }

        /* --- 6. SVG PIN SHAPES --- */
        .pin-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
        .pin-icon svg { width: 100%; height: 100%; fill: transparent; stroke-width: 2px; }

        /* Header Icon (Diamond Arrow) */
        .header-icon-svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 1.5; }

        /* Exec Pin (Wedge) */
        .exec-pin svg { stroke: var(--pin-exec); }

        /* Float Output (Compound Shape) */
        .data-pin-output { width: 26px; } 
        .data-pin-output svg { overflow: visible; stroke: var(--pin-float); }
        .data-pin-output .pin-arrow { fill: var(--pin-float); stroke: none; } 
    </style>
</head>
<body>
    <!-- HTML STRUCTURE -->
    <div class="ue-node">
        <div class="ue-header">
            <!-- Exact Header Icon (Diamond with Solid Block Arrow) -->
            <svg class="header-icon-svg" viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                <!-- Diamond Outline -->
                <path d="M12 3 L 21 12 L 12 21 L 3 12 Z" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
                <!-- Solid Block Arrow (Centered) -->
                <path d="M 7.5 10 L 11.5 10 L 11.5 7 L 16.5 12 L 11.5 17 L 11.5 14 L 7.5 14 Z" fill="white" stroke="none"/>
            </svg>
            
            <span class="node-title">Event Tick</span>
            
            <div class="delegate-icon"></div>
        </div>
        
        <div class="ue-body">
            <div class="column inputs"></div>
            
            <div class="column outputs">
                <!-- 1. Exec Pin (Wedge) -->
                <div class="pin-row">
                    <div class="pin-icon exec-pin">
                        <svg viewBox="0 0 12 14">
                            <path d="M 2 1 L 9 1 L 12 7 L 9 13 L 2 13 Z" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>
                
                <!-- 2. Data Output Pin -->
                <div class="pin-row">
                    <span class="pin-label">Delta Seconds</span>
                    <div class="pin-icon data-pin-output">
                        <!-- Adjusted ViewBox width to 18 (tighter) -->
                        <svg viewBox="0 0 18 12">
                            <!-- Circle: Ends at 10.5 -->
                            <circle cx="6" cy="6" r="4.5" fill="transparent" stroke="#00EA32" stroke-width="2" />
                            
                            <!-- Arrow: Shifted closer (x=11.5). Gap is now only 1 unit. -->
                            <path class="pin-arrow" d="M 11.5 3 L 17 6 L 11.5 9 Z" fill="#00EA32" stroke="none" />
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
